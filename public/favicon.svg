<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Graded Exam Sheet -->
  <g filter="url(#dropShadow)">
    <!-- Document Base -->
    <rect x="120" y="80" width="272" height="352" rx="24" fill="#ffffff" />
    
    <!-- Clipboard Header Clip -->
    <rect x="200" y="56" width="112" height="40" rx="12" fill="#334155" />
    
    <!-- Writing Lines (Simulated Questions) -->
    <rect x="160" y="150" width="120" height="12" rx="6" fill="#cbd5e1" />
    <rect x="160" y="180" width="180" height="12" rx="6" fill="#e2e8f0" />
    
    <rect x="160" y="230" width="100" height="12" rx="6" fill="#cbd5e1" />
    <rect x="160" y="260" width="190" height="12" rx="6" fill="#e2e8f0" />
    
    <rect x="160" y="310" width="140" height="12" rx="6" fill="#cbd5e1" />
    <rect x="160" y="340" width="160" height="12" rx="6" fill="#e2e8f0" />
    
    <!-- Large Red "A+" Graded Stamp -->
    <text x="325" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ef4444" transform="rotate(-10 325 210)" text-anchor="middle">A+</text>
    
    <!-- Green Checkmark on the last question -->
    <circle cx="340" cy="335" r="24" fill="#10b981" />
    <path d="M328 335l8 8 16-16" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>